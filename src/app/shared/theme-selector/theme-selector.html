<div class="theme-selector" (click)="stopPropagation($event)" (keydown)="onKeydown($event)">
  <button
    #trigger
    type="button"
    class="theme-selector__trigger"
    aria-label="Cambiar tema"
    aria-haspopup="menu"
    aria-controls="theme-selector-menu"
    [attr.aria-expanded]="open()"
    (click)="toggle()"
  >
    <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
      <path d="M10 2.5a7.5 7.5 0 1 0 0 15c.9 0 1.4-.8 1.4-1.5 0-.5-.3-.9-.3-1.3 0-.7.6-1.2 1.3-1.2h1.7A3.9 3.9 0 0 0 18 9.6C18 5.5 14.4 2.5 10 2.5Z" />
      <circle cx="6.3" cy="9.3" r="1" />
      <circle cx="9.2" cy="6.2" r="1" />
      <circle cx="13" cy="7.2" r="1" />
    </svg>
    <span class="theme-selector__trigger-text" aria-hidden="true">Tema</span>
    <svg class="theme-selector__chevron" viewBox="0 0 12 12" aria-hidden="true" focusable="false">
      <path d="M2 4.5 6 8.5l4-4" />
    </svg>
  </button>

  @if (open()) {
    <div
      id="theme-selector-menu"
      class="theme-selector__panel"
      role="menu"
      aria-label="Temas"
      (click)="stopPropagation($event)"
    >
      @for (option of options; track option.id) {
        <button
          type="button"
          class="theme-selector__option"
          role="menuitemradio"
          [class.is-current]="theme.theme() === option.id"
          [attr.aria-checked]="theme.theme() === option.id"
          (click)="select(option.id)"
          (keydown)="onOptionKeydown($event, option.id)"
        >
          <span class="theme-selector__check" aria-hidden="true">
            @if (theme.theme() === option.id) { ✓ }
          </span>
          <span>{{ option.label }}</span>
        </button>
      }
    </div>
  }
</div>
